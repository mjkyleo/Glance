<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Glance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-controls">
        <span id="progress-text" class="progress-text"></span>
        <button class="control-button" id="help-button" title="Help">Help</button>
        <button class="control-button" id="settings-button" title="Settings">Settings</button>
     </div>
    <div class="container">
       
        <div class="main-content">
            <button class="nav-button" id="prev-button" title="Previous (←)">&lt;</button>
            <div class="word-area" id="word-area">
                <div id="word">Welcome!</div>
                <div id="meaning">Load a TSV file to start.</div>
                <div id="example" class="example" style="display:none;"></div>
            </div>
            <button class="nav-button" id="next-button" title="Next (→ / Space)">&gt;</button>
        </div>
        <div class="controls-bottom">
            <div class="learned-control">
                <input type="checkbox" id="learned-checkbox"/>
                <label for="learned-checkbox" title="Mark learned (L)">Learned</label>
            </div>
            <div class="buttons-right">
                <button class="control-button icon-button" id="shuffle-button" title="Shuffle (X)">🔀</button>
                <button class="control-button icon-button" id="quiz-button" title="Quiz mode (Q)">👁</button>
                <button class="control-button" id="mode-button" title="Hide controls (H)">Hide</button>
                <button class="control-button icon-button" id="speak-button" title="Speak (S)">🔊</button>
                <button class="control-button icon-button" id="edit-button" title="Edit TSV File" disabled>✎</button>
                <button class="control-button icon-button" id="load-button" title="Load TSV File">📂</button>
            </div>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
