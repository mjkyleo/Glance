apply plugin: 'com.android.application'

def glancePkg = new groovy.json.JsonSlurper().parseText(rootProject.file('../package.json').text)
def versionCodeProperty = project.findProperty('glanceVersionCode')
def versionCodeText = versionCodeProperty?.toString() ?: '1'
if (!(versionCodeText ==~ /[1-9][0-9]{0,9}/) || versionCodeText.toLong() > 2100000000L) {
    throw new GradleException('glanceVersionCode must be an integer between 1 and 2100000000')
}
def glanceVersionCode = versionCodeText.toInteger()
def releaseStorePath = System.getenv('GLANCE_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('GLANCE_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('GLANCE_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('GLANCE_RELEASE_KEY_PASSWORD')

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase(java.util.Locale.ROOT).contains('release') }) {
        if (!versionCodeProperty || !releaseStorePath || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword) {
            throw new GradleException('Release requires -PglanceVersionCode and all GLANCE_RELEASE_* signing environment variables; no debug fallback')
        }
        if (!file(releaseStorePath).isFile()) {
            throw new GradleException('Release keystore file does not exist')
        }
        if (file(releaseStorePath).canonicalFile == rootProject.file('keystore/glance-debug.keystore').canonicalFile) {
            throw new GradleException('The public debug keystore cannot sign a release')
        }
    }
}

android {
    namespace "com.glance.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.glance.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode glanceVersionCode
        // 版本名带上构建号，安装/应用信息里能直接看出是不是新包。
        versionName "${glancePkg.version}+${glanceVersionCode}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 固定调试签名：GitHub Actions 每次都是全新机器，不指定则每个 APK 签名不同，
    // 无法覆盖安装旧版本（提示“应用未安装”）。此密钥仅用于 debug 包。
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/glance-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStorePath) storeFile file(releaseStorePath)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
