name: Release order maintenance

# GitHub 偶尔把少数旧 release 排到最新版之上（服务端排序异常，API 与网页一致）。
# 用户确认删除卡在最上方的 android-7 / android-8 / android-9 三个旧 release：
# 只删 release 及其 APK 资产，保留 git tag（代码仍可通过 tag 获取）。
# 目标写死，重复运行安全（已删除的会跳过）。
on:
  push:
    paths:
      - .github/workflows/release-order.yml
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the three releases stuck above the latest one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for tag in android-7 android-8 android-9; do
            id=$(gh api "repos/$repo/releases/tags/$tag" --jq '.id' 2>/dev/null || true)
            if [ -z "$id" ]; then
              echo "$tag: release already absent, tag kept"
              continue
            fi
            echo "Deleting release $tag (id $id); git tag is kept"
            gh api -X DELETE "repos/$repo/releases/$id"
          done
          echo "Remaining releases in API order:"
          gh api "repos/$repo/releases?per_page=100" --jq '.[] | [.tag_name, (.draft|tostring)] | @tsv'
