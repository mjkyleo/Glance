name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/release-order.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glance-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Glance-android.apk
          PREV=$(git tag --list 'android-*' --sort=-v:refname | head -n1)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~1..HEAD"; fi
          LAST_PRODUCT=$(git log -1 --format=%H -- app main.js package.json android capacitor.config.json || true)
          TITLE=""
          [ -n "$LAST_PRODUCT" ] && TITLE=$(git log -1 --pretty=%s "$LAST_PRODUCT")
          # Pipeline-only commits (no product change since the previous release) use their own subject.
          PIPELINE_ONLY=0
          if [ -n "$PREV" ] && [ -n "$LAST_PRODUCT" ] && git merge-base --is-ancestor "$LAST_PRODUCT" "$PREV"; then PIPELINE_ONLY=1; fi
          if [ "$PIPELINE_ONLY" = 1 ] || [ -z "$TITLE" ]; then TITLE=$(git log -1 --pretty=%s); fi
          CHANGES=$(git log "$RANGE" --no-merges --pretty=format:'- %s' -- app main.js package.json android capacitor.config.json)
          [ -z "$CHANGES" ] && CHANGES=$(git log "$RANGE" --no-merges --pretty=format:'- %s')
          [ -z "$CHANGES" ] && CHANGES="- $(git log -1 --pretty=%s)"
          NOTES="$CHANGES

          Build #${{ github.run_number }} · ${GITHUB_SHA:0:7}$( [ -n "$PREV" ] && printf ' · changes since %s' "$PREV" )"
          echo "Release title: $TITLE"
          echo "$NOTES"
          gh release create "android-${{ github.run_number }}" Glance-android.apk \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"