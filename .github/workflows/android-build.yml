name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/release-order.yml'
      # Repository cognition layer: versioned knowledge, never packaged into the APK.
      - 'aoci.txt'
      - 'aoci.meta.txt'
      - 'aoci.code.txt'
      - '.aoci/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Strip dev-only FSRS contrast side-path
        run: |
          rm -rf android/app/src/main/assets/public/dev android/app/src/main/assets/public/js/vendor

      - name: Check release web assets
        run: |
          node scripts/verify-panel-order.js
          node scripts/verify-custom-compat.js
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'android/app/src/main/assets/public';
          for (const name of ['dev', 'js/vendor']) {
            if (fs.existsSync(path.join(root, name))) throw new Error('Dev-only assets remain: ' + name);
          }
          const forbidden = /DEV_FREE_API|QNAI_FREE_API|QWEN_MAAS_API|rc-366f|sk-91774e|sk-ws-H/;
          function check(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) check(file);
              else if (forbidden.test(fs.readFileSync(file, 'utf8'))) throw new Error('Development credential marker found in ' + file);
            }
          }
          check(root);
          NODE

      - name: Build release APK (public debug keystore)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PglanceVersionCode=${{ github.run_number }}

      - name: Verify APK build metadata
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION=$(node -p "require('./package.json').version")
          BADGING=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK")
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.glance.app' versionCode='$BUILD_NUMBER'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION+$BUILD_NUMBER'"
          printf '%s\n' "$BADGING" | grep -Fx "sdkVersion:'22'"
          printf '%s\n' "$BADGING" | grep -Fx "targetSdkVersion:'34'"
          if [[ "$BADGING" == *application-debuggable* ]]; then
            echo '::error::Release APK must not be debuggable'
            exit 1
          fi
          CERTS=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$CERTS"
          printf '%s\n' "$CERTS" | grep -Fx "Number of signers: 1"
          printf '%s\n' "$CERTS" | grep -Fx 'Verified using v1 scheme (JAR signing): true'
          printf '%s\n' "$CERTS" | grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true'
          # 断言 release 签名与仓库公开 debug keystore 一致，保证旧版可覆盖安装。
          EXPECTED=$(keytool -exportcert -keystore android/keystore/glance-debug.keystore -storepass android -alias androiddebugkey | sha256sum)
          printf '%s\n' "$CERTS" | grep -Fx "Signer #1 certificate SHA-256 digest: ${EXPECTED%% *}"
          cp "$APK" Glance-android.apk
          sha256sum Glance-android.apk > Glance-android.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glance-Android-APK
          path: |
            Glance-android.apk
            Glance-android.apk.sha256
          if-no-files-found: error

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BYTES=$(stat -c%s Glance-android.apk)
          CHECKSUM=$(sha256sum Glance-android.apk)
          PREV=$(git describe --tags --match 'android-*' --abbrev=0 HEAD 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~1..HEAD"; fi
          LAST_PRODUCT=$(git log -1 --format=%H -- app main.js package.json android capacitor.config.json || true)
          TITLE=""
          [ -n "$LAST_PRODUCT" ] && TITLE=$(git log -1 --pretty=%s "$LAST_PRODUCT")
          # Pipeline-only commits (no product change since the previous release) use their own subject.
          PIPELINE_ONLY=0
          if [ -n "$PREV" ] && [ -n "$LAST_PRODUCT" ] && git merge-base --is-ancestor "$LAST_PRODUCT" "$PREV"; then PIPELINE_ONLY=1; fi
          if [ "$PIPELINE_ONLY" = 1 ] || [ -z "$TITLE" ]; then TITLE=$(git log -1 --pretty=%s); fi
          CHANGES=$(git log "$RANGE" --no-merges --pretty=format:'- %s' -- app main.js package.json android capacitor.config.json)
          [ -z "$CHANGES" ] && CHANGES=$(git log "$RANGE" --no-merges --pretty=format:'- %s')
          [ -z "$CHANGES" ] && CHANGES="- $(git log -1 --pretty=%s)"
          NOTES="$CHANGES

          Version $VERSION · Build #${{ github.run_number }} · ${GITHUB_SHA:0:7}$( [ -n "$PREV" ] && printf ' · changes since %s' "$PREV" )
          Package: com.glance.app · Release (not debuggable) · Android 5.1+ / target API 34
          APK: $BYTES bytes
          SHA-256: ${CHECKSUM%% *}

          使用仓库内公开调试签名，与历史调试包同签名可直接覆盖安装。若覆盖失败，先从「我的 → 数据备份」导出并确认备份可读取，再卸载旧版、安装并导入；API Key 不在备份中，需重新填写。公开签名不具备防伪造性，正式上架前需改用私有发布签名。"
          TITLE="Glance $VERSION (build ${{ github.run_number }}) · $TITLE"
          echo "Release title: $TITLE"
          echo "$NOTES"
          gh release create "android-${{ github.run_number }}" Glance-android.apk Glance-android.apk.sha256 \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"