<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f2f2f7" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Glance · 词根背单词</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Glance</span>
          <span class="lib-name" id="lib-name">词库</span>
        </span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="lib-button" type="button" title="选择词库" aria-label="选择词库">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 4h7a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5H4V4Zm16 0h-7a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5H20V4Z"/></svg>
        </button>
        <button class="icon-btn" id="shuffle-button" type="button" title="乱序" aria-label="乱序">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17 3l4 4-4 4V8h-2.2l-2.3 3.2-1.5-2.1L13.4 6H17V3ZM3 6h4.3l8 11H21v-3l4 4-4 4v-3h-6.7l-8-11H3V6Zm0 11h4.3l2.2-3.1 1.5 2.1L8.3 19H3v-2Z"/></svg>
        </button>
        <button class="icon-btn" id="overlay-button" type="button" title="悬浮窗" aria-label="悬浮窗">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-3H5a2 2 0 0 1-2-2V5Zm11 5v7h5v-7h-5Z"/></svg>
        </button>
      </div>
    </header>

    <div class="mode-switch" role="tablist" aria-label="模式">
      <button class="mode-btn active" id="mode-study" type="button" role="tab" aria-selected="true">学习</button>
      <button class="mode-btn" id="mode-quiz" type="button" role="tab" aria-selected="false">测试</button>
    </div>

    <main class="study" id="study-view">
      <section class="word-block">
        <div class="word-row">
          <h1 class="word" id="word">Glance</h1>
          <button class="speak-btn" id="speak-button" type="button" title="朗读 (S)" aria-label="朗读">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4ZM14 2.2v2.1a7.8 7.8 0 0 1 0 15.4v2.1a9.9 9.9 0 0 0 0-19.6Z"/></svg>
          </button>
        </div>
        <div class="phonetic" id="phonetic"></div>
        <div class="morphemes" id="morphemes"></div>
      </section>

      <section class="cards" id="cards"></section>
    </main>

    <main class="study" id="quiz-view" hidden>
      <section class="word-block">
        <span class="quiz-badge">预览 · 测试功能开发中</span>
        <div class="word-row">
          <h1 class="word" id="quiz-word">Glance</h1>
        </div>
        <div class="phonetic" id="quiz-phonetic"></div>
        <div class="quiz-question">选择正确的释义</div>
      </section>
      <section class="quiz-options" id="quiz-options"></section>
      <button class="quiz-submit" id="quiz-submit" type="button" disabled>提交答案</button>
    </main>

    <footer class="app-footer" id="app-footer">
      <button class="nav-btn" id="prev-button" type="button" title="上一个 (←)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15 5l-7 7 7 7 1.4-1.4L10.8 12l5.6-5.6L15 5Z"/></svg>
        <span>上一个</span>
      </button>
      <div class="progress">
        <div class="progress-text" id="progress-text"></div>
        <div class="bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <button class="nav-btn learned" id="learned-button" type="button" title="已掌握 (L)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 16.2l-3.5-3.5L4 14.2 9 19.2 20 8.2l-1.4-1.4L9 16.2Z"/></svg>
        <span>已掌握</span>
      </button>
      <button class="nav-btn primary" id="next-button" type="button" title="下一个 (→ / 空格)">
        <span>下一个</span>
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 5l7 7-7 7-1.4-1.4L13.2 12 7.6 6.4 9 5Z"/></svg>
      </button>
    </footer>
  </div>

  <script src="js/platform.js"></script>
  <script src="js/library.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
